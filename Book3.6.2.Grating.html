<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmission Grating Experiment Simulation</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        /* Upper Row: Controls */
        .upper-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eaeaea;
            align-items: flex-end;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 200px;
        }
        .control-group label {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9em;
        }
        .slider-val {
            color: #007bff;
            font-weight: bold;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-start { background: #28a745; color: white; }
        .btn-start:hover { background: #218838; }
        .btn-pause { background: #ffc107; color: black; }
        .btn-pause:hover { background: #e0a800; }
        .btn-reset { background: #dc3545; color: white; }
        .btn-reset:hover { background: #c82333; }
        .btn-quiz { background: #17a2b8; color: white; }
        .btn-quiz:hover { background: #138496; }

        /* Lower Row: Simulation & Calculations */
        .lower-row {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .sim-container {
            flex: 2;
            min-width: 400px;
            background: #000;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            background: #111;
            width: 100%;
            height: 400px;
            display: block;
        }
        .calc-container {
            flex: 1;
            min-width: 280px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 0.95em;
            line-height: 1.6;
        }
        .calc-title {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #0056b3;
            border-bottom: 1px solid #ccc;
            padding-bottom: 5px;
        }

        /* Quiz Modal Overlay */
        #quiz-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .quiz-content {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .quiz-title {
            font-size: 1.5em;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .quiz-input {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 15px 0;
        }
        .quiz-option {
            background: #f1f1f1;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .quiz-option:hover {
            background: #e2e2e2;
        }
        .quiz-option.selected {
            border-color: #007bff;
            background: #e6f2ff;
        }
        .quiz-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="upper-row">
        <div class="control-group">
            <label>Slits per mm (N): <span id="val-slits" class="slider-val">300</span></label>
            <input type="range" id="input-slits" min="100" max="500" value="300" step="10">
        </div>
        <div class="control-group">
            <label>Distance to Screen (L): <span id="val-dist" class="slider-val">3 m</span></label>
            <input type="range" id="input-dist" min="1" max="10" value="3" step="0.5">
        </div>
        <div class="control-group">
            <label>Wavelength (λ): <span id="val-wave" class="slider-val">500 nm</span></label>
            <input type="range" id="input-wave" min="450" max="700" value="500" step="5">
        </div>
        
        <div class="btn-group">
            <button class="btn-start" onclick="startSimulation()">Start</button>
            <button class="btn-pause" onclick="togglePause()">Pause / Resume</button>
            <button class="btn-reset" onclick="resetSimulation()">Reset</button>
            <button class="btn-quiz" onclick="openQuiz()">Start a Quiz</button>
        </div>
    </div>

    <div class="lower-row">
        <div class="sim-container">
            <canvas id="simCanvas" width="600" height="400"></canvas>
        </div>
        <div class="calc-container">
            <div class="calc-title">Calculations & Steps</div>
            <div id="calc-content">
                <i>Click "Start" to see the simulated calculations.</i>
            </div>
        </div>
    </div>
</div>

<!-- Quiz Modal -->
<div id="quiz-modal">
    <div class="quiz-content" id="quiz-box">
        <!-- Content gets injected here via JS -->
    </div>
</div>

<script>
    /* ==============================
       SIMULATION & PHYSICS LOGIC
       ============================== */
    
    // UI Elements
    const slSlits = document.getElementById('input-slits');
    const slDist = document.getElementById('input-dist');
    const slWave = document.getElementById('input-wave');
    const valSlits = document.getElementById('val-slits');
    const valDist = document.getElementById('val-dist');
    const valWave = document.getElementById('val-wave');
    const calcContent = document.getElementById('calc-content');
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    // State Variables
    let animState = 'stopped'; // stopped, playing, paused
    let animProgress = 0;
    let reqFrame;

    // Helper: Convert Wavelength to RGB
    function nmToRGB(wavelength) {
        let R, G, B;
        if (wavelength >= 450 && wavelength < 490) {
            R = 0.0; G = (wavelength - 440) / (490 - 440); B = 1.0;
        } else if (wavelength >= 490 && wavelength < 510) {
            R = 0.0; G = 1.0; B = -(wavelength - 510) / (510 - 490);
        } else if (wavelength >= 510 && wavelength < 580) {
            R = (wavelength - 510) / (580 - 510); G = 1.0; B = 0.0;
        } else if (wavelength >= 580 && wavelength < 645) {
            R = 1.0; G = -(wavelength - 645) / (645 - 580); B = 0.0;
        } else if (wavelength >= 645 && wavelength <= 700) {
            R = 1.0; G = 0.0; B = 0.0;
        } else {
            R = 0; G = 0; B = 0;
        }
        return `rgb(${Math.round(R*255)}, ${Math.round(G*255)}, ${Math.round(B*255)})`;
    }

    // Update slider texts
    slSlits.oninput = () => valSlits.textContent = slSlits.value;
    slDist.oninput = () => valDist.textContent = slDist.value + " m";
    slWave.oninput = () => valWave.textContent = slWave.value + " nm";

    function drawSimulation() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Coordinates and Dimensions
        const startX = 20;
        const gratingX = 150;
        const screenX = 550;
        const centerY = canvas.height / 2;

        // Draw Grating (Dashed line)
        ctx.strokeStyle = "#888";
        ctx.lineWidth = 4;
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.moveTo(gratingX, 20);
        ctx.lineTo(gratingX, canvas.height - 20);
        ctx.stroke();
        ctx.setLineDash([]);
        
        // Draw Screen (Solid line)
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(screenX, 20);
        ctx.lineTo(screenX, canvas.height - 20);
        ctx.stroke();

        if (animState === 'stopped') return;

        // Fetch Physics Values
        const N = parseFloat(slSlits.value);
        const L = parseFloat(slDist.value);
        const lambda = parseFloat(slWave.value);
        const d = 1e-3 / N; // meters
        const lambda_m = lambda * 1e-9; // meters
        const n_max = Math.floor(d / lambda_m);
        const color = nmToRGB(lambda);

        // Progress Animation
        if (animState === 'playing') animProgress += 0.02;

        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = 3;

        // Draw incident beam (Source to Grating)
        const currentIncidentX = Math.min(gratingX, startX + animProgress * (gratingX - startX));
        ctx.beginPath();
        ctx.moveTo(startX, centerY);
        ctx.lineTo(currentIncidentX, centerY);
        ctx.stroke();

        // Draw Diffracted beams (Grating to Screen)
        if (animProgress > 1) {
            const diffProgress = Math.min(1, animProgress - 1);
            
            // Loop through -n_max to +n_max
            for (let n = -n_max; n <= n_max; n++) {
                const theta = Math.asin(n * lambda_m / d); 
                
                // Graphical representation: We map the exact geometric angle onto the canvas
                // dx = distance from grating to screen on canvas
                const dxCanvas = screenX - gratingX;
                const dyCanvas = dxCanvas * Math.tan(theta);
                
                const targetX = gratingX + dxCanvas;
                const targetY = centerY + dyCanvas;

                const currentX = gratingX + diffProgress * (targetX - gratingX);
                const currentY = centerY + diffProgress * (targetY - centerY);

                ctx.globalAlpha = 0.7; // slight transparency for beams
                ctx.beginPath();
                ctx.moveTo(gratingX, centerY);
                ctx.lineTo(currentX, currentY);
                ctx.stroke();
                
                // Draw spots on screen
                if (diffProgress >= 1) {
                    ctx.globalAlpha = 1.0;
                    ctx.beginPath();
                    ctx.arc(targetX, targetY, 6, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Add text label for order n
                    ctx.fillStyle = "#fff";
                    ctx.font = "12px Arial";
                    ctx.fillText(`n=${n}`, targetX + 10, targetY + 4);
                    ctx.fillStyle = color;
                }
            }
            ctx.globalAlpha = 1.0;
        }

        if (animState === 'playing' || animState === 'paused') {
            reqFrame = requestAnimationFrame(drawSimulation);
        }
    }

    function calculateSteps() {
        const N = parseFloat(slSlits.value);
        const L = parseFloat(slDist.value);
        const lambda = parseFloat(slWave.value);

        const d = 1e-3 / N; // meters
        const lambda_m = lambda * 1e-9; // meters
        const n_max = Math.floor(d / lambda_m);

        let html = `<b>1. Grating Constant (d):</b><br>`;
        html += `d = 1 / N = 1 / ${N} mm = ${(d).toExponential(3)} m<br><br>`;
        
        html += `<b>2. Wavelength (λ):</b><br>`;
        html += `λ = ${lambda} nm = ${(lambda_m).toExponential(3)} m<br><br>`;

        html += `<b>3. Angular Positions (θ = arcsin(nλ/d)):</b><br>`;
        if (n_max >= 1) {
            let theta1 = Math.asin(1 * lambda_m / d) * 180 / Math.PI;
            html += `<i>1st Order (n=1):</i><br>`;
            html += `θ₁ = arcsin( 1 × ${(lambda_m).toExponential(2)} / ${(d).toExponential(2)} ) = <b>${theta1.toFixed(2)}°</b><br>`;
        }
        if (n_max >= 2) {
            let theta2 = Math.asin(2 * lambda_m / d) * 180 / Math.PI;
            html += `<i>2nd Order (n=2):</i><br>`;
            html += `θ₂ = arcsin( 2 × ${(lambda_m).toExponential(2)} / ${(d).toExponential(2)} ) = <b>${theta2.toFixed(2)}°</b><br>`;
        } else {
             html += `<i>2nd Order (n=2) bright fringe does not exist.</i><br>`;
        }
        html += `<br>`;

        html += `<b>4. Maximum Order (n_max):</b><br>`;
        html += `n_max = ⌊ d / λ ⌋ = ⌊ ${(d).toExponential(2)} / ${(lambda_m).toExponential(2)} ⌋ = <b>${n_max}</b><br>`;

        calcContent.innerHTML = html;
    }

    function startSimulation() {
        cancelAnimationFrame(reqFrame);
        animState = 'playing';
        animProgress = 0;
        calculateSteps();
        drawSimulation();
    }

    function togglePause() {
        if (animState === 'playing') {
            animState = 'paused';
        } else if (animState === 'paused') {
            animState = 'playing';
            drawSimulation();
        }
    }

    function resetSimulation() {
        cancelAnimationFrame(reqFrame);
        animState = 'stopped';
        animProgress = 0;
        calcContent.innerHTML = `<i>Click "Start" to see the simulated calculations.</i>`;
        drawSimulation();
    }

    // Initialize blank canvas
    drawSimulation();


    /* ==============================
       QUIZ LOGIC & GOOGLE FORM
       ============================== */
    const quizModal = document.getElementById('quiz-modal');
    const quizBox = document.getElementById('quiz-box');

    let S_Class = '';
    let S_Number = '';
    let S_Mark = 0;
    let currentQuestion = 0;
    let selectedOption = -1;

    const quizData = [
        {
            q: "What is the primary formula used for a transmission grating?",
            options: ["d sin(θ) = n λ", "n₁ sin(θ₁) = n₂ sin(θ₂)", "E = m c²", "V = I R"],
            ans: 0
        },
        {
            q: "If the wavelength of light used increases, what happens to the angle of the 1st order fringe?",
            options: ["Decreases", "Increases", "Remains the same", "Becomes zero"],
            ans: 1
        },
        {
            q: "If the number of slits per mm (N) increases, what happens to the spacing between fringes on the screen?",
            options: ["Increases", "Decreases", "Remains the same", "Fringes disappear"],
            ans: 0
        },
        {
            q: "What does 'd' represent in the grating equation?",
            options: ["Distance to screen", "Slit spacing (distance between adjacent slits)", "Wavelength", "Diameter of the light beam"],
            ans: 1
        },
        {
            q: "Which color of visible light is diffracted through the largest angle by a grating?",
            options: ["Violet", "Blue", "Green", "Red"],
            ans: 3
        },
        {
            q: "What is the maximum order possible if d = 2000 nm and λ = 500 nm?",
            options: ["1", "2", "3", "4"],
            ans: 3
        },
        {
            q: "What is the path difference between adjacent slits for the 2nd order bright fringe?",
            options: ["λ/2", "λ", "2λ", "4λ"],
            ans: 2
        },
        {
            q: "If the distance to the screen (L) increases, does the angular position (θ) of the fringes change?",
            options: ["Yes, it increases", "Yes, it decreases", "No, it remains the same", "Depends on the intensity"],
            ans: 2
        },
        {
            q: "How is the slit spacing 'd' related to the number of lines per mm 'N'?",
            options: ["d = N mm", "d = 1/N mm", "d = 1000/N mm", "d = N/1000 mm"],
            ans: 1
        },
        {
            q: "What color is the central maximum (n=0) if white light is used instead of monochromatic light?",
            options: ["Red", "Violet", "White", "Black (No light)"],
            ans: 2
        }
    ];

    function openQuiz() {
        S_Class = '';
        S_Number = '';
        S_Mark = 0;
        currentQuestion = 0;
        quizModal.style.display = 'flex';
        renderRegistration();
    }

    function closeQuiz() {
        quizModal.style.display = 'none';
    }

    function renderRegistration() {
        quizBox.innerHTML = `
            <div class="quiz-title">Student Information</div>
            <label>Class:</label>
            <input type="text" id="s-class" class="quiz-input" placeholder="e.g. 4A">
            <label>Class Number:</label>
            <input type="number" id="s-num" class="quiz-input" placeholder="e.g. 15">
            <div class="quiz-footer">
                <button class="btn-reset" onclick="closeQuiz()">Cancel</button>
                <button class="btn-start" onclick="startQuizTest()">Start Quiz</button>
            </div>
        `;
    }

    function startQuizTest() {
        const cInp = document.getElementById('s-class').value.trim();
        const nInp = document.getElementById('s-num').value.trim();
        if(!cInp || !nInp) {
            alert("Please enter both Class and Class Number.");
            return;
        }
        S_Class = cInp;
        S_Number = nInp;
        S_Mark = 0;
        currentQuestion = 0;
        renderQuestion();
    }

    function renderQuestion() {
        if (currentQuestion >= quizData.length) {
            renderResult();
            return;
        }
        const qData = quizData[currentQuestion];
        selectedOption = -1;
        
        let optionsHtml = '';
        qData.options.forEach((opt, idx) => {
            optionsHtml += `<div class="quiz-option" onclick="selectOption(${idx})" id="opt-${idx}">${opt}</div>`;
        });

        quizBox.innerHTML = `
            <div class="quiz-title">Question ${currentQuestion + 1} / ${quizData.length}</div>
            <p style="font-size: 1.1em;">${qData.q}</p>
            <div class="quiz-options">
                ${optionsHtml}
            </div>
            <div class="quiz-footer">
                <button class="btn-start" onclick="nextQuestion()">Next</button>
            </div>
        `;
    }

    function selectOption(idx) {
        selectedOption = idx;
        const opts = document.querySelectorAll('.quiz-option');
        opts.forEach(el => el.classList.remove('selected'));
        document.getElementById('opt-' + idx).classList.add('selected');
    }

    function nextQuestion() {
        if (selectedOption === -1) {
            alert("Please select an answer.");
            return;
        }
        if (selectedOption === quizData[currentQuestion].ans) {
            S_Mark++;
        }
        currentQuestion++;
        renderQuestion();
    }

    function renderResult() {
        quizBox.innerHTML = `
            <div class="quiz-title">Quiz Completed!</div>
            <p style="font-size: 1.2em;">Student: <b>${S_Class} (${S_Number})</b></p>
            <p style="font-size: 1.5em; color: #007bff;">Your Score: <b>${S_Mark} / ${quizData.length}</b></p>
            <div class="quiz-footer">
                <button class="btn-pause" onclick="retryQuiz()">Retry Test</button>
                <button class="btn-start" onclick="finishQuiz()">Finish</button>
            </div>
        `;
    }

    function retryQuiz() {
        S_Mark = 0;
        currentQuestion = 0;
        renderQuestion();
    }

    function finishQuiz() {
        // Submit automatically to Google Form without leaving the page
        // Replaced "viewform" with "formResponse" to allow silent data submission
        const formURL = `https://docs.google.com/forms/d/e/1FAIpQLSc4HBzOHGrgbn3hXCwFfMsrvlw0RYm163GogskDDpXEhT110w/formResponse?usp=pp_url&entry.753594098=${encodeURIComponent(S_Class)}&entry.777103265=${encodeURIComponent(S_Number)}&entry.1173990498=${encodeURIComponent(S_Mark)}&submit=Submit`;
        
        fetch(formURL, { mode: 'no-cors' })
        .then(() => {
            alert(`Test Finished! Score ${S_Mark}/${quizData.length} saved successfully.`);
            closeQuiz();
        })
        .catch(err => {
            console.error("Error submitting form", err);
            alert("Test finished, but there was a network error sending the score. Please check your connection.");
            closeQuiz();
        });
    }

</script>

</body>
</html>
