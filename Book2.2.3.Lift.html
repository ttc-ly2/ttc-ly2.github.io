<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lift Physics Simulation</title>
    <style>
        :root {
            --primary: #3498db;
            --primary-hover: #2980b9;
            --dark: #2c3e50;
            --light: #ecf0f1;
            --success: #2ecc71;
            --danger: #e74c3c;
            --border: #bdc3c7;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f7fa;
            color: var(--dark);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-top: 0;
        }
        
        /* Upper Row - Controls */
        .controls-row {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }
        .control-group {
            flex: 1;
            min-width: 250px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .control-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        .control-item label {
            flex: 1;
        }
        .control-item input[type="range"] {
            flex: 1;
        }
        .control-item span {
            width: 40px;
            text-align: right;
            font-weight: bold;
        }
        .input-box-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .input-box-group input {
            width: 50px;
            padding: 4px;
            text-align: center;
            border: 1px solid var(--border);
            border-radius: 4px;
        }
        .buttons-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            width: 100%;
            justify-content: center;
            margin-top: 10px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
            background-color: var(--primary);
            color: white;
        }
        button:hover { background-color: var(--primary-hover); }
        button.quiz-btn { background-color: #9b59b6; }
        button.quiz-btn:hover { background-color: #8e44ad; }
        button.reset-btn { background-color: #95a5a6; }
        button.reset-btn:hover { background-color: #7f8c8d; }

        /* Lower Row - Simulation */
        .simulation-row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .col {
            flex: 1;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            min-width: 300px;
            position: relative;
        }
        .col h2 {
            margin-top: 0;
            text-align: center;
            font-size: 18px;
        }
        canvas {
            width: 100%;
            background-color: #fafafa;
            border: 1px solid var(--border);
            border-radius: 4px;
            display: block;
        }

        /* Quiz Overlay */
        .quiz-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .quiz-box {
            background: white;
            padding: 30px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .quiz-box h2 { margin-top: 0; }
        .quiz-input-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .quiz-input-group input {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 16px;
        }
        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        .quiz-option {
            background: var(--light);
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: 0.2s;
        }
        .quiz-option:hover { background: #dcdde1; }
        .quiz-footer {
            margin-top: 20px;
            text-align: right;
            display: flex;
            justify-content: space-between;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <h1>Body in a Lift Simulation</h1>

    <!-- UPPER ROW -->
    <div class="controls-row">
        <div class="control-group">
            <div class="control-item">
                <label>Mass of Body (kg)</label>
                <input type="range" id="mass" min="10" max="100" value="50" oninput="updateValues()">
                <span id="massVal">50</span>
            </div>
            <div class="control-item">
                <label>Max Speed (m/s)</label>
                <input type="range" id="vmax" min="3" max="20" value="8" oninput="updateValues()">
                <span id="vmaxVal">8</span>
            </div>
            <div class="input-box-group" style="margin-top: 10px;">
                <label>From Floor:</label>
                <input type="number" id="floorFrom" value="6" min="1" max="100" onchange="updateValues()">
                <label>To Floor:</label>
                <input type="number" id="floorTo" value="1" min="1" max="100" onchange="updateValues()">
            </div>
        </div>
        
        <div class="control-group">
            <div class="control-item">
                <label>Acceleration Upward (m/s²)</label>
                <input type="range" id="accUp" min="1" max="10" value="3" oninput="updateValues()">
                <span id="accUpVal">3</span>
            </div>
            <div class="control-item">
                <label>Acceleration Downward (m/s²)</label>
                <input type="range" id="accDown" min="1" max="10" value="3" oninput="updateValues()">
                <span id="accDownVal">3</span>
            </div>
            <div class="control-item" style="margin-top: 10px;">
                <label style="font-weight: bold;">Graph Output:</label>
                <select id="graphType" onchange="updateValues()" style="flex: 1; padding: 5px; border-radius: 4px; border: 1px solid var(--border);">
                    <option value="normal" selected>Normal Force (R) vs Time</option>
                    <option value="net">Net Force (F_net) vs Time</option>
                </select>
            </div>
        </div>

        <div class="buttons-group">
            <button id="startBtn" onclick="startSimulation()">Start</button>
            <button id="pauseBtn" onclick="togglePause()">Pause / Resume</button>
            <button class="reset-btn" onclick="resetSimulation()">Reset</button>
            <button class="quiz-btn" onclick="openQuiz()">Start a Quiz</button>
        </div>
    </div>

    <!-- LOWER ROW -->
    <div class="simulation-row">
        <div class="col">
            <h2>Free Body Diagram</h2>
            <canvas id="fbdCanvas" width="500" height="400"></canvas>
        </div>
        <div class="col">
            <h2 id="graphTitle">Normal Force - Time Graph</h2>
            <canvas id="graphCanvas" width="500" height="400"></canvas>
        </div>
    </div>
</div>

<!-- QUIZ OVERLAY -->
<div class="quiz-overlay" id="quizOverlay">
    <div class="quiz-box">
        <!-- Registration Screen -->
        <div id="quizRegScreen">
            <h2>Lift Physics Quiz</h2>
            <p>Please enter your details to begin the 10-question multiple-choice exercise.</p>
            <div class="quiz-input-group">
                <label>Class</label>
                <input type="text" id="sClass" placeholder="e.g. 5A">
            </div>
            <div class="quiz-input-group">
                <label>Class Number</label>
                <input type="number" id="sNumber" placeholder="e.g. 12">
            </div>
            <div class="quiz-footer" style="justify-content: flex-end;">
                <button onclick="closeQuiz()" class="reset-btn" style="margin-right: 10px;">Cancel</button>
                <button onclick="startQuizTest()">Start Quiz</button>
            </div>
        </div>

        <!-- Question Screen -->
        <div id="quizQScreen" class="hidden">
            <h2 id="qNumberTitle">Question 1 / 10</h2>
            <p id="qText" style="font-size: 16px; font-weight: 500;"></p>
            <div class="quiz-options" id="qOptions"></div>
        </div>

        <!-- Result Screen -->
        <div id="quizResultScreen" class="hidden">
            <h2>Quiz Finished</h2>
            <p>Your Score: <strong id="qScoreDisp" style="font-size: 24px;"></strong> / 10</p>
            <div class="quiz-footer">
                <button onclick="startQuizTest()" class="reset-btn">Retry Test</button>
                <!-- This button now auto-submits directly in the background -->
                <button id="finishSubmitBtn" onclick="finishQuiz()">Submit & Finish Test</button>
            </div>
        </div>
    </div>
</div>

<script>
    /* -------------------------------------------------------------
       PHYSICS SIMULATION LOGIC
    ------------------------------------------------------------- */
    const G = 9.81; // Gravity
    const FLOOR_HEIGHT = 3.0; // meters per floor
    const SIMULATION_SPEED = 0.4; // Simulation speed factor (0.4 = 40% real time, making it slower)

    // Inputs
    let m = 50, vmax = 8, a_up = 3, a_down = 3, f_from = 6, f_to = 1;
    
    // Sim State
    let isRunning = false;
    let isPaused = false;
    let t = 0;
    let lastTime = 0;
    let animationId;

    // Movement Profile
    let t1 = 0, t2 = 0, t3 = 0, t_total = 0;
    let dir = 0; // 1 for UP, -1 for DOWN
    let a_accel = 0, a_decel = 0; // magnitudes
    let d1 = 0, d2 = 0, d3 = 0;
    let actual_vmax = 0;

    // Current metrics
    let curr_y = 0;
    let curr_v = 0;
    let curr_a = 0;
    let curr_floor = 6;
    let f_net = 0;
    let r_force = 0;

    // UI Elements
    const fbdCanvas = document.getElementById('fbdCanvas');
    const fbdCtx = fbdCanvas.getContext('2d');
    const graphCanvas = document.getElementById('graphCanvas');
    const graphCtx = graphCanvas.getContext('2d');

    function updateValues() {
        m = parseFloat(document.getElementById('mass').value);
        vmax = parseFloat(document.getElementById('vmax').value);
        a_up = parseFloat(document.getElementById('accUp').value);
        a_down = parseFloat(document.getElementById('accDown').value);
        f_from = parseInt(document.getElementById('floorFrom').value);
        f_to = parseInt(document.getElementById('floorTo').value);

        document.getElementById('massVal').innerText = m;
        document.getElementById('vmaxVal').innerText = vmax;
        document.getElementById('accUpVal').innerText = a_up;
        document.getElementById('accDownVal').innerText = a_down;

        // Update Graph Title dynamically
        let gType = document.getElementById('graphType').value;
        if (gType === 'normal') {
            document.getElementById('graphTitle').innerText = "Normal Force - Time Graph";
        } else {
            document.getElementById('graphTitle').innerText = "Net Force - Time Graph";
        }

        if(!isRunning) {
            curr_floor = f_from;
            calculateProfile();
            f_net = 0; 
            r_force = m * G; // Reset default to resting forces
            drawFBD();
            drawGraph();
        }
    }

    function calculateProfile() {
        let distance = Math.abs(f_to - f_from) * FLOOR_HEIGHT;
        if (f_to > f_from) dir = 1;
        else if (f_to < f_from) dir = -1;
        else dir = 0;

        if (dir === 0) {
            t1 = t2 = t3 = t_total = 0;
            return;
        }

        if (dir === 1) {
            a_accel = a_up;
            a_decel = a_down;
        } else {
            a_accel = a_down;
            a_decel = a_up;
        }

        let v_peak = Math.sqrt((2 * distance * a_accel * a_decel) / (a_accel + a_decel));

        if (v_peak < vmax) {
            actual_vmax = v_peak;
            t1 = actual_vmax / a_accel;
            t2 = 0;
            t3 = actual_vmax / a_decel;
            d1 = 0.5 * a_accel * t1 * t1;
            d2 = 0;
            d3 = 0.5 * a_decel * t3 * t3;
        } else {
            actual_vmax = vmax;
            t1 = actual_vmax / a_accel;
            t3 = actual_vmax / a_decel;
            d1 = 0.5 * a_accel * t1 * t1;
            d3 = 0.5 * a_decel * t3 * t3;
            d2 = distance - d1 - d3;
            t2 = d2 / actual_vmax;
        }
        t_total = t1 + t2 + t3;
    }

    function computeKinematicsAt(time) {
        if (dir === 0) return { a: 0, v: 0, d: 0 };
        
        let a, v, d;
        if (time <= t1) {
            a = dir * a_accel;
            v = dir * a_accel * time;
            d = 0.5 * a_accel * time * time;
        } else if (time <= t1 + t2) {
            a = 0;
            v = dir * actual_vmax;
            let dt = time - t1;
            d = d1 + actual_vmax * dt;
        } else if (time <= t_total) {
            a = dir * (-a_decel);
            let dt = time - t1 - t2;
            v = dir * (actual_vmax - a_decel * dt);
            d = d1 + d2 + actual_vmax * dt - 0.5 * a_decel * dt * dt;
        } else {
            a = 0;
            v = 0;
            d = d1 + d2 + d3;
        }
        return { a, v, d };
    }

    function startSimulation() {
        if (isRunning && !isPaused) return;
        if (isPaused) {
            isPaused = false;
            lastTime = performance.now();
            requestAnimationFrame(simLoop);
            return;
        }
        updateValues();
        calculateProfile();
        t = 0;
        isRunning = true;
        isPaused = false;
        lastTime = performance.now();
        requestAnimationFrame(simLoop);
    }

    function togglePause() {
        if (!isRunning) return;
        isPaused = !isPaused;
        if (!isPaused) {
            lastTime = performance.now();
            requestAnimationFrame(simLoop);
        }
    }

    function resetSimulation() {
        isRunning = false;
        isPaused = false;
        cancelAnimationFrame(animationId);
        
        // Reset inputs
        document.getElementById('mass').value = 50;
        document.getElementById('vmax').value = 8;
        document.getElementById('accUp').value = 3;
        document.getElementById('accDown').value = 3;
        document.getElementById('floorFrom').value = 6;
        document.getElementById('floorTo').value = 1;
        // Note: Graph Type is not reset to allow users to keep their preferred view.
        
        updateValues();
        t = 0;
        curr_a = 0; curr_v = 0; curr_y = 0; f_net = 0; r_force = m*G;
        drawFBD();
        drawGraph();
    }

    function simLoop(timestamp) {
        if (!isRunning || isPaused) return;
        
        // Use simulation speed multiplier to slow down the animation
        let dt = ((timestamp - lastTime) / 1000) * SIMULATION_SPEED; 
        lastTime = timestamp;
        t += dt;

        if (t >= t_total) {
            t = t_total;
            isRunning = false;
            let k = computeKinematicsAt(t_total); // Force kinematics to exactly stop state
            curr_a = k.a;
            curr_v = k.v;
            curr_y = k.d;
        } else {
            let k = computeKinematicsAt(t);
            curr_a = k.a;
            curr_v = k.v;
            curr_y = k.d;
        }
        
        curr_floor = f_from + dir * (curr_y / FLOOR_HEIGHT);
        f_net = m * curr_a;
        r_force = m * G + f_net; 

        drawFBD();
        drawGraph();

        if (isRunning) {
            animationId = requestAnimationFrame(simLoop);
        }
    }

    /* -------------------------------------------------------------
       DRAWING LOGIC
    ------------------------------------------------------------- */
    function drawArrow(ctx, x, y, len, direction, color, text) {
        ctx.beginPath();
        ctx.moveTo(x, y);
        let endY = y + (direction === 'up' ? -len : len);
        ctx.lineTo(x, endY);
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.stroke();

        // arrowhead
        ctx.beginPath();
        ctx.moveTo(x, endY);
        ctx.lineTo(x - 6, endY + (direction === 'up' ? 10 : -10));
        ctx.lineTo(x + 6, endY + (direction === 'up' ? 10 : -10));
        ctx.fillStyle = color;
        ctx.fill();

        // text (aligned properly to prevent overlap)
        ctx.fillStyle = "#333";
        ctx.font = "bold 14px Arial";
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        ctx.fillText(text, x + 15, y + (direction === 'up' ? -len/2 : len/2));
    }

    function drawFBD() {
        fbdCtx.clearRect(0, 0, fbdCanvas.width, fbdCanvas.height);
        
        // Lift box - Shifted left to make more room for arrows on the right
        fbdCtx.strokeStyle = "#7f8c8d";
        fbdCtx.lineWidth = 4;
        fbdCtx.strokeRect(110, 100, 150, 250);
        
        // Floor text - kept centered on canvas
        fbdCtx.fillStyle = "#2c3e50";
        fbdCtx.font = "bold 18px Segoe UI";
        fbdCtx.textAlign = "center";
        fbdCtx.textBaseline = "alphabetic";
        fbdCtx.fillText(`Current Floor: ${curr_floor.toFixed(1)}`, 250, 40);

        // Body (box)
        fbdCtx.fillStyle = "#e67e22";
        fbdCtx.fillRect(150, 270, 70, 80);
        fbdCtx.fillStyle = "white";
        fbdCtx.font = "14px Arial";
        fbdCtx.fillText(`${m} kg`, 185, 315);

        let cx = 185; // new center x of body inside the shifted lift

        // Weight Arrow
        let w = m * G;
        drawArrow(fbdCtx, cx - 15, 310, 60, 'down', '#e74c3c', `W = ${w.toFixed(1)} N`);

        // Normal Force Arrow
        let r_len = 60 * (r_force / w); 
        if(r_len < 5) r_len = 5; // min visibility
        drawArrow(fbdCtx, cx + 15, 350, r_len, 'up', '#27ae60', `R = ${r_force.toFixed(1)} N`);

        // Net force text inside canvas
        fbdCtx.fillStyle = "#2c3e50";
        fbdCtx.font = "bold 16px Arial";
        fbdCtx.textAlign = "left";
        fbdCtx.textBaseline = "alphabetic";
        fbdCtx.fillText(`Net Force: ${f_net.toFixed(1)} N`, 280, 150);

        // Reset text styles for kinematics 0-values mapping
        fbdCtx.font = "bold 14px Arial";
        fbdCtx.textBaseline = "middle";

        // Velocity Arrow - Spaced out clearly at x=280
        if (Math.abs(curr_v) > 0.01) {
            drawArrow(fbdCtx, 280, 250, 50, curr_v > 0 ? 'up' : 'down', '#2980b9', `v = ${Math.abs(curr_v).toFixed(2)} m/s`);
        } else {
            fbdCtx.fillText(`v = 0.00 m/s`, 295, 250);
        }

        // Accel Arrow - Spaced out significantly at x=390
        if (Math.abs(curr_a) > 0.01) {
            drawArrow(fbdCtx, 390, 250, 50, curr_a > 0 ? 'up' : 'down', '#8e44ad', `a = ${Math.abs(curr_a).toFixed(2)} m/s²`);
        } else {
            fbdCtx.fillText(`a = 0.00 m/s²`, 405, 250);
        }
    }

    function drawGraph() {
        graphCtx.clearRect(0, 0, graphCanvas.width, graphCanvas.height);
        let W = graphCanvas.width;
        let H = graphCanvas.height;
        
        let padLeft = 60;
        let padRight = 40;
        let padTop = 50;
        let padBottom = 50;

        let plotHeight = H - padTop - padBottom;
        let plotWidth = W - padLeft - padRight;
        let midY = padTop + (plotHeight / 2);

        // Calculate amplitude mapping dynamically based on type of graph selected
        let graphType = document.getElementById('graphType').value;
        let maxA = Math.max(a_up, a_down);
        let forceAmplitude = m * maxA * 1.2; 
        if (forceAmplitude === 0) forceAmplitude = 10; // Prevent divide by zero error
        
        // Define base levels depending on graph type
        let baseForce = (graphType === 'normal') ? m * G : 0;
        let maxPlotForce = baseForce + forceAmplitude;
        let minPlotForce = baseForce - forceAmplitude;
        let titleForce = (graphType === 'normal') ? "Normal Force (N)" : "Net Force (N)";

        // Axes Drawing
        graphCtx.strokeStyle = "#333";
        graphCtx.lineWidth = 1;
        graphCtx.beginPath();
        // y-axis
        graphCtx.moveTo(padLeft, padTop);
        graphCtx.lineTo(padLeft, H - padBottom);
        // x-axis (at Base Force = 0 or mg)
        graphCtx.moveTo(padLeft, midY);
        graphCtx.lineTo(W - padRight, midY);
        graphCtx.stroke();

        // Clearer Axis Titles
        graphCtx.fillStyle = "#2c3e50";
        graphCtx.font = "bold 15px Arial";
        graphCtx.textAlign = "center";
        graphCtx.textBaseline = "alphabetic";
        graphCtx.fillText(titleForce, padLeft, padTop - 20);
        graphCtx.fillText("Time (s)", W - padRight, midY + 35);

        // Axis Tick Labels (Numbers)
        graphCtx.font = "12px Arial";
        graphCtx.textAlign = "right";
        graphCtx.textBaseline = "middle";
        graphCtx.fillStyle = "#333";
        graphCtx.fillText(maxPlotForce.toFixed(0), padLeft - 8, padTop);
        graphCtx.fillText(baseForce.toFixed(0), padLeft - 8, midY);
        graphCtx.fillText(minPlotForce.toFixed(0), padLeft - 8, H - padBottom);

        if (t_total === 0) return;

        // X-Axis Max Time Tick Label
        graphCtx.textAlign = "center";
        graphCtx.textBaseline = "top";
        graphCtx.fillText(t_total.toFixed(1), W - padRight, midY + 8);

        // Value Mapping Functions
        function getX(time) { return padLeft + (time / t_total) * plotWidth; }
        // getY uses interpolation from the top parameter down
        function getY(f) { 
            return padTop + plotHeight * (1 - (f - minPlotForce) / (2 * forceAmplitude)); 
        }

        // Plot the Ideal Line Journey
        graphCtx.strokeStyle = "#3498db";
        graphCtx.lineWidth = 3;
        graphCtx.beginPath();
        
        let f1 = baseForce + m * (dir * a_accel);
        let f2 = baseForce;
        let f3 = baseForce + m * (dir * -a_decel);

        graphCtx.moveTo(getX(0), getY(f1));
        graphCtx.lineTo(getX(t1), getY(f1));
        graphCtx.lineTo(getX(t1), getY(f2));
        graphCtx.lineTo(getX(t1 + t2), getY(f2));
        graphCtx.lineTo(getX(t1 + t2), getY(f3));
        graphCtx.lineTo(getX(t_total), getY(f3));
        graphCtx.lineTo(getX(t_total), getY(baseForce));
        graphCtx.stroke();

        // Current Time Indicator Line
        let currX = getX(t);
        graphCtx.strokeStyle = "#e74c3c";
        graphCtx.lineWidth = 2;
        graphCtx.beginPath();
        graphCtx.moveTo(currX, padTop);
        graphCtx.lineTo(currX, H - padBottom);
        graphCtx.stroke();

        // Current Time Indicator Dot
        let currentForceForGraph = (graphType === 'normal') ? r_force : f_net;
        graphCtx.fillStyle = "#e74c3c";
        graphCtx.beginPath();
        graphCtx.arc(currX, getY(currentForceForGraph), 6, 0, Math.PI*2);
        graphCtx.fill();

        // **SHOW LIVE DATA VALUES ON THE GRAPH**
        graphCtx.fillStyle = "#c0392b";
        graphCtx.font = "bold 16px Courier New";
        graphCtx.textAlign = "right";
        graphCtx.textBaseline = "top";
        graphCtx.fillText(`Time: ${t.toFixed(2)} s`, W - padRight, padTop - 25);
        
        let forcePrefix = (graphType === 'normal') ? 'R' : 'Net';
        graphCtx.fillText(`${forcePrefix}: ${currentForceForGraph.toFixed(1)} N`, W - padRight, padTop - 5);
    }

    // Initialization
    window.onload = function() {
        updateValues();
    };

    /* -------------------------------------------------------------
       QUIZ LOGIC
    ------------------------------------------------------------- */
    let sClass = "";
    let sNumber = "";
    let sMark = 0;
    let currentQ = 0;

    const questions = [
        {
            q: "When a lift accelerates upwards, the apparent weight (normal force) of a body is:",
            options: ["Equal to its true weight", "Greater than its true weight", "Less than its true weight", "Zero"],
            ans: 1
        },
        {
            q: "If a lift is moving downwards with a constant velocity, the net force acting on the body inside is:",
            options: ["Zero", "Upwards", "Downwards", "Equal to its weight"],
            ans: 0
        },
        {
            q: "A person experiences weightlessness (apparent weight is zero) in a lift when:",
            options: ["The lift accelerates upwards at g", "The lift accelerates downwards at g", "The lift moves downwards at a constant speed", "The lift stops suddenly"],
            ans: 1
        },
        {
            q: "According to Newton's Second Law, the Net Force acting on a body in a lift is calculated by:",
            options: ["Mass × Velocity", "Mass × Gravity", "Mass × Acceleration", "Normal Force + Weight"],
            ans: 2
        },
        {
            q: "A 50 kg person is in a lift accelerating upwards at 2 m/s². What is the net force acting on the person?",
            options: ["100 N upwards", "100 N downwards", "590 N upwards", "0 N"],
            ans: 0
        },
        {
            q: "Which force represents the 'apparent weight' of the person in the free body diagram?",
            options: ["Gravity (W)", "Net Force (F_net)", "Normal Force (R)", "Frictional Force"],
            ans: 2
        },
        {
            q: "If a lift is moving downwards and slowing down (decelerating), the direction of its acceleration is:",
            options: ["Upwards", "Downwards", "Zero", "Horizontal"],
            ans: 0
        },
        {
            q: "The normal force (R) is less than the true weight (W) when the lift is:",
            options: ["Accelerating upwards", "Accelerating downwards", "Moving at constant velocity", "At rest"],
            ans: 1
        },
        {
            q: "During the constant velocity phase of the lift's journey, the normal force (R) is equal to:",
            options: ["m(g + a)", "m(g - a)", "mg (True weight)", "Zero"],
            ans: 2
        },
        {
            q: "If a lift moves from Floor 1 to Floor 6, what is the direction of acceleration when it starts and when it stops?",
            options: ["Starts: Upwards, Stops: Downwards", "Starts: Downwards, Stops: Upwards", "Starts: Upwards, Stops: Upwards", "Starts: Downwards, Stops: Downwards"],
            ans: 0
        }
    ];

    const quizOverlay = document.getElementById('quizOverlay');
    const regScreen = document.getElementById('quizRegScreen');
    const qScreen = document.getElementById('quizQScreen');
    const resScreen = document.getElementById('quizResultScreen');

    function openQuiz() {
        quizOverlay.style.display = 'flex';
        regScreen.classList.remove('hidden');
        qScreen.classList.add('hidden');
        resScreen.classList.add('hidden');
        document.getElementById('sClass').value = '';
        document.getElementById('sNumber').value = '';
    }

    function closeQuiz() {
        quizOverlay.style.display = 'none';
    }

    function startQuizTest() {
        sClass = document.getElementById('sClass').value.trim();
        sNumber = document.getElementById('sNumber').value.trim();
        
        if(!sClass || !sNumber) {
            alert("Please enter Class and Class Number.");
            return;
        }

        sMark = 0;
        currentQ = 0;
        regScreen.classList.add('hidden');
        resScreen.classList.add('hidden');
        qScreen.classList.remove('hidden');
        
        loadQuestion();
    }

    function loadQuestion() {
        if (currentQ >= questions.length) {
            showResults();
            return;
        }
        
        let q = questions[currentQ];
        document.getElementById('qNumberTitle').innerText = `Question ${currentQ + 1} / 10`;
        document.getElementById('qText').innerText = q.q;
        
        let optsDiv = document.getElementById('qOptions');
        optsDiv.innerHTML = "";
        
        q.options.forEach((opt, index) => {
            let div = document.createElement('div');
            div.className = 'quiz-option';
            div.innerText = opt;
            div.onclick = () => answerQuestion(index);
            optsDiv.appendChild(div);
        });
    }

    function answerQuestion(idx) {
        if (idx === questions[currentQ].ans) {
            sMark++;
        }
        currentQ++;
        loadQuestion();
    }

    function showResults() {
        qScreen.classList.add('hidden');
        resScreen.classList.remove('hidden');
        document.getElementById('qScoreDisp').innerText = sMark;
    }

    function finishQuiz() {
        // Change button text to show progress
        let btn = document.getElementById("finishSubmitBtn");
        let originalText = btn.innerText;
        btn.innerText = "Submitting...";
        btn.disabled = true;

        // Automatically POST to the Google Form response handler endpoint
        const baseURL = "https://docs.google.com/forms/d/e/1FAIpQLSd2DUiJdsEJWQ4MufkuI1N5Hbok00qI-nq9BVq3jOVKDZmPZg/formResponse";
        
        // Setup URL Search Params using the form entry IDs provided
        const formData = new URLSearchParams();
        formData.append("entry.753594098", sClass);
        formData.append("entry.777103265", sNumber);
        formData.append("entry.1173990498", sMark);

        // Send fetch request with 'no-cors' mode to bypass browser CORS block silently
        fetch(baseURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: formData.toString()
        }).then(() => {
            alert(`Your score of ${sMark}/10 has been automatically submitted to the system.`);
            closeQuiz();
        }).catch((err) => {
            console.error("Submission Error", err);
            alert(`There was an issue submitting your results automatically.`);
            closeQuiz();
        }).finally(() => {
            btn.innerText = originalText;
            btn.disabled = false;
        });
    }
</script>

</body>
</html>
